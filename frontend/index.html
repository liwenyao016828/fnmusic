<!doctype html>
<html lang="zh-CN" style="background-color: #F3F3F3; color-scheme: light;">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <!--
      2026-11-03（用户「应用图标有时能显示、有时不能」）：
        ① ?v= 是**换地址的开关** —— favicon.png 的地址固定，浏览器/WebView 会各自
           缓很久；改了图标只要把 v 加一，所有端都会重新拉一次。
        ② apple-touch-icon：iOS 的「添加到主屏幕」和 Safari 标签页用的是它，
           不写就只能去抓 /apple-touch-icon.png（我们没这个文件）→ 图标时有时无。
    -->
    <link rel="icon" type="image/png" href="/favicon.png?v=1" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- 顶栏玻璃色；Safari 地址栏与 PWA 标题栏跟随画布 -->
    <meta name="theme-color" content="#F3F3F3" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>曲率 - AI Music Hub</title>
    <!--
      首屏底色与字体必须在 CSS 生效前就位，否则会闪一下暗底/系统默认字体。

      2026-10-19 视觉重构：应用是**亮色**界面，而这里原来是 #07080d 暗底 ——
      首屏会先黑一下再变白。
      2026-10-29 飞牛化：底色由旧画布 #F5F5F7 换成 --ys-chrome 的 #F3F3F3
      （飞牛的框架层色）。**这一处很容易漏**：html/#app 的内联底色比 style.css 更早生效，
      漏掉就会出现「CSS 变了但首屏还是旧灰」的观感——实测 body 仍算出 rgb(245,245,247)
      就是它造成的。
      字体与 tailwind.config.js 的 fontFamily.sans 保持一致。
    -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #F3F3F3;
        color: #0B0B0C;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
          "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow: hidden;
      }
      #app {
        width: 100%;
        height: 100%;
        background-color: #F3F3F3;
      }
    </style>
  </head>
  <body class="select-none overflow-hidden">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
